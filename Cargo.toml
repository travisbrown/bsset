[package]
name = "bsset"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/bsset"
description = "Byte-string set with a fixed key length, prefix-based membership, and mmap-backed storage"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
readme = "README.md"
version = "0.3.0"

[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[dependencies]
memmap2 = "0.9"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
proptest = "1"
